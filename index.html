<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Soothe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="Soothe: a quiet peer-support space for University of Michigan students. Peer support, not therapy.">
<meta name="theme-color" content="#F3EEF6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 30 30%22%3E%3Ccircle cx=%2211%22 cy=%2212%22 r=%228%22 fill=%22%23B9A9E0%22/%3E%3Ccircle cx=%2219%22 cy=%2212%22 r=%228%22 fill=%22%23F2B89A%22 opacity=%22.9%22/%3E%3Ccircle cx=%2215%22 cy=%2219%22 r=%228%22 fill=%22%23A9C9A0%22 opacity=%22.9%22/%3E%3C/svg%3E">
<script>
  // On a real phone, skip the drawn iPhone and open the app full screen.
  if (Math.min(screen.width, window.innerWidth) < 600 && matchMedia('(pointer: coarse)').matches) location.replace('app.html' + location.hash);
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: radial-gradient(1200px 800px at 15% 10%, #F8E3D6 0%, transparent 60%), radial-gradient(1000px 700px at 90% 90%, #E4DDF4 0%, transparent 60%), #F5F0EC; font-family: system-ui, -apple-system, sans-serif; }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  /* iPhone body: 390 x 844 screen inside a 14px bezel */
  .phone { position: relative; width: 418px; height: 872px; flex-shrink: 0; border-radius: 64px; background: #1B1A1F; box-shadow: 0 0 0 2px #8D8A92, 0 0 0 5px #C9C6CE, 0 0 0 6px #77747C, 0 40px 90px rgba(47, 42, 54, 0.28), 0 12px 30px rgba(47, 42, 54, 0.18); transform-origin: center center; }
  .btn { position: absolute; width: 5px; border-radius: 3px; background: linear-gradient(90deg, #A9A6AE, #77747C); }
  .btn.action { left: -9px; top: 140px; height: 32px; } .btn.up { left: -9px; top: 200px; height: 62px; } .btn.down { left: -9px; top: 276px; height: 62px; } .btn.power { right: -9px; top: 236px; height: 96px; background: linear-gradient(270deg, #A9A6AE, #77747C); }
  .screen { position: absolute; inset: 14px; border-radius: 50px; overflow: hidden; background: #FBF6EF; isolation: isolate; }
  .screen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #FBF6EF; }
  .status { position: absolute; z-index: 2; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 4px 34px 0 46px; box-sizing: border-box; pointer-events: none; color: #1B1A1F; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
  .status .icons { display: flex; align-items: center; gap: 6px; }
  .island { position: absolute; z-index: 3; top: 11px; left: 50%; width: 124px; height: 36px; margin-left: -62px; border-radius: 18px; background: #000; pointer-events: none; }
  .home { position: absolute; z-index: 2; bottom: 8px; left: 50%; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; background: #1B1A1F; pointer-events: none; }
</style>
</head>
<body>
<div class="stage">
  <div class="phone" id="phone" role="group" aria-label="Soothe on an iPhone">
    <span class="btn action" aria-hidden="true"></span><span class="btn up" aria-hidden="true"></span><span class="btn down" aria-hidden="true"></span><span class="btn power" aria-hidden="true"></span>
    <div class="screen">
      <iframe id="app" title="Soothe app" src="app.html?framed=1"></iframe>
      <div class="status" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/><rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 008 .5 10.2 10.2 0 00.8 3.4L2 4.6a8.4 8.4 0 016-2.4zm0 3.4c1.4 0 2.7.5 3.6 1.4l1.2-1.2A6.8 6.8 0 008 3.9 6.8 6.8 0 003.2 5.8L4.4 7c.9-.9 2.2-1.4 3.6-1.4zm0 3.4c.5 0 1 .2 1.3.5L8 10.8 6.7 9.5c.3-.3.8-.5 1.3-.5z" fill="currentColor"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity="0.4"/><rect x="2" y="2" width="20" height="9" rx="2.2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity="0.5"/></svg>
        </span>
      </div>
      <div class="island" aria-hidden="true"></div>
      <div class="home" aria-hidden="true"></div>
    </div>
  </div>
</div>
<script>
  // Scale the phone so the whole thing always fits inside the window.
  var phone = document.getElementById('phone');
  function fit() {
    var pad = 24, w = 418 + 2 * 9 + pad * 2, h = 872 + pad * 2;
    var k = Math.min(1, window.innerWidth / w, window.innerHeight / h);
    phone.style.transform = 'scale(' + k.toFixed(4) + ')';
  }
  window.addEventListener('resize', fit); fit();
  function tick() { var d = new Date(); var h = d.getHours() % 12 || 12; document.getElementById('clock').textContent = h + ':' + String(d.getMinutes()).padStart(2, '0'); }
  tick(); setInterval(tick, 15000);
</script>
</body>
</html>
